name: agent

# Runs the $100 Trading Agent on GitHub's free computers.
# Every 5 minutes while US markets can be open (both clock settings covered),
# and every 30 minutes all week for crypto and news. Times are UTC.
on:
  schedule:
    - cron: "2-59/5 13-21 * * 1-5"
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run, selftest or probe"
        default: "run"
        required: true

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the news model's libraries
        run: pip install -q -r requirements.txt || echo "News model libraries unavailable; the agent will use word rules."
      - name: Keep the downloaded news model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: news-model-ae0eab9
      - name: Run the agent
        run: python3 agent.py ${{ github.event.inputs.command || 'run' }}
        env:
          AGENT_GITHUB_REPO: ${{ github.repository }}
          AGENT_GITHUB_OWNER: ${{ github.repository_owner }}
          AGENT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AGENT_RUNNER: github
